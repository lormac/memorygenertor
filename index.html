<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Memory Generator</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
.card{
  width:420px;
  background:#1f1f1f;
  padding:28px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.hidden{display:none}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:8px;
  border:none;
  box-sizing:border-box;
}
button{
  background:#d4af37;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}
.product-card{
  display:block;
  margin-top:12px;
  padding:14px;
  background:#2b2b2b;
  border-radius:10px;
  cursor:pointer;
}
.product-card:hover{
  outline:2px solid #d4af37;
}
.product-card input{
  width:auto;
  margin-right:10px;
}
.message{
  color:#ffcf6b;
  min-height:20px;
}
</style>
</head>

<body>

<div id="unlockScreen" class="card">
  <h1>The Memory Generator</h1>
  <p>Enter your access code.</p>

  <input id="accessCodeInput" placeholder="Example: DINO234">
  <button id="unlockBtn" type="button">Unlock</button>

  <p id="unlockMessage" class="message"></p>
</div>

<div id="productScreen" class="card hidden">
  <h2>Your Purchased Products</h2>
  <div id="productList"></div>
  <button id="openProductBtn" type="button">Open Product</button>
</div>

<script>
window.accessCodes = {};
window.productCatalog = {};
window.unlockedProducts = [];

async function loadJSON(path) {
  const res = await fetch(path);

  if (!res.ok) {
    throw new Error("Could not load " + path);
  }

  return await res.json();
}

async function unlockCode() {
  const code = document
    .getElementById("accessCodeInput")
    .value
    .trim()
    .toUpperCase()
    .replace(/\s+/g, "");

  document.getElementById("unlockMessage").textContent = "";

  try {
    window.accessCodes = await loadJSON("data/access_codes.json");
    window.productCatalog = await loadJSON("data/product_catalog.json");
  } catch (err) {
    document.getElementById("unlockMessage").textContent =
      "Could not load access code files.";
    console.error(err);
    return;
  }

  if (!window.accessCodes[code]) {
    document.getElementById("unlockMessage").textContent =
      "Code not found. Please check your code and try again.";
    return;
  }

  window.unlockedProducts = window.accessCodes[code].products || [];

  console.log("Code entered:", code);
  console.log("Unlocked products:", window.unlockedProducts);
  console.log("Product catalog:", window.productCatalog);

  document.getElementById("unlockScreen").classList.add("hidden");
  document.getElementById("productScreen").classList.remove("hidden");

  renderProductList();
}

function renderProductList() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  if (!window.unlockedProducts.length) {
    list.innerHTML = "<p>No products are attached to this code.</p>";
    return;
  }

  window.unlockedProducts.forEach((productId, index) => {
    const product = window.productCatalog[productId];

    if (!product) {
      console.error("Missing product in product_catalog.json:", productId);

      const missing = document.createElement("div");
      missing.className = "product-card";
      missing.textContent = "Missing product in catalog: " + productId;
      list.appendChild(missing);
      return;
    }

    const row = document.createElement("label");
    row.className = "product-card";

    row.innerHTML =
      '<input type="radio" name="productChoice" value="' +
      productId +
      '" ' +
      (index === 0 ? "checked" : "") +
      "> " +
      product.title || product.name || productId;

    list.appendChild(row);
  });
}

function openSelectedProduct() {
  const selected = document.querySelector(
    'input[name="productChoice"]:checked'
  );

  if (!selected) {
    alert("Please choose a product.");
    return;
  }

  const product = window.productCatalog[selected.value];

  if (!product) {
    alert("This product is missing from product_catalog.json.");
    return;
  }

  if (product.url) {
    window.location.href = product.url;
    return;
  }

  if (product.generator) {
  window.location.href =
    "generators/" +
    product.generator +
    "/index.html?product=" +
    encodeURIComponent(selected.value);
  return;
}

  alert("This product needs either a url or generator in product_catalog.json.");
}

document.getElementById("unlockBtn").addEventListener("click", unlockCode);
document.getElementById("openProductBtn").addEventListener("click", openSelectedProduct);

document.getElementById("accessCodeInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    unlockCode();
  }
});
</script>

</body>
</html>
