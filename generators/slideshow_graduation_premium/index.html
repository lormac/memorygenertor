<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #2a1a00, #050505 55%, #000);
    color: #f8f1dc;
    font-family: Arial, sans-serif;
  }

  .app {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
  }
  @font-face {
	  font-family: 'MarkerFont';
	  src: url('fonts/PermanentMarker-Regular.ttf') format('truetype');
	  font-weight: 400;
	}

  .sidebar {
    padding: 20px;
    background: rgba(0,0,0,.72);
    border-right: 1px solid rgba(212,175,55,.4);
  }

  h1 {
    font-family: Georgia, serif;
    color: #f6df8f;
    font-size: 26px;
  }

  label {
    display: block;
    margin-top: 14px;
    margin-bottom: 5px;
    color: #f6df8f;
    font-weight: bold;
  }

  input, select, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid rgba(212,175,55,.5);
    background: #111;
    color: white;
  }

  textarea {
    min-height: 60px;
  }

  button {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #d4af37, #f6df8f, #8a6a18);
    color: #050505;
    font-weight: bold;
    cursor: pointer;
  }

  .preview-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
  }

  #stage {
    position: relative;
    width: 960px;
    height: 540px;
    background: black;
    overflow: hidden;
    box-shadow: 0 0 45px rgba(212,175,55,.35);
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .slide.active {
    opacity: 1;
  }

  .slide-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
  }

  .photo-box {
    position: absolute;
    overflow: hidden;
    z-index: 1;
  }

  .photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1);
  }

  .slide.active .photo-box img {
    animation: kenburns 6s linear forwards;
  }

  @keyframes kenburns {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
  }

  .text-box {
    position: absolute;
    z-index: 3;
color: #F6DF8F;





	font-family: 'Montserrat', sans-serif;
	font-weight: 800;
	letter-spacing: 2px;
	
text-shadow:
  0 2px 4px rgba(0,0,0,.9),
  0 0 12px rgba(212,175,55,.45);
	  
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: pre-line;
    opacity: 0;
    filter: brightness(.8);
  }

  .slide.active .text-box {
    animation: textGlowIn 1.8s ease forwards;
  }

 @keyframes textGlowIn {
  0% {
    opacity: 1;
    transform: scale(.96);
  }

  60% {
    opacity: 1;
    transform: scale(1.03);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

  .hidden {
    display: none;
  }
  .then-now-frame {
  position: absolute;
  left: 9%;
  top: 24%;
  width: 32%;
  height: 56%;
  z-index: 2;
  overflow: hidden;
  border: 10px solid #d4af37;
  box-shadow: 0 0 25px rgba(212,175,55,.65);
  
}

.slide.active .then-now-frame {
  animation: moveFrameRight 8s ease-in-out forwards;
}

.slide.active .then-photo-old {
  animation: oldPhotoFade 8s ease-in-out forwards;
}

.slide.active .then-photo-new {
  animation: newPhotoFade 8s ease-in-out forwards, gentleZoom 8s linear forwards;
}

.slide.active .then-text-old {
  animation: oldTextFade 8s ease-in-out forwards;
}

.slide.active .then-text-new {
  animation: newTextFade 8s ease-in-out forwards;
}

.then-now-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.then-photo-old {
  opacity: 1;
  }

.then-photo-new {
  opacity: 0;
 }

.then-text-old {
  position: absolute;
  right: 8%;
  top: 32%;
  width: 34%;
  z-index: 3;
  color: #f6df8f;
  font-family: Georgia, serif;
  font-size: 44px;
  font-weight: bold;
  text-align: center;
  white-space: pre-line;
  text-shadow: 0 0 18px rgba(0,0,0,.9);
}

.then-text-new {
  position: absolute;
  left: 7%;
  top: 32%;
  width: 34%;
  z-index: 3;
  color: #f6df8f;
  font-family: Georgia, serif;
  font-size: 48px;
  font-weight: bold;
  text-align: center;
  white-space: pre-line;
  text-shadow: 0 0 18px rgba(0,0,0,.9), 0 0 20px rgba(212,175,55,.45);
  opacity: 0;
  
}

@keyframes moveFrameRight {
  0%, 25% {
    left: 9%;
  }
  75%, 100% {
    left: 59%;
  }
}

@keyframes oldPhotoFade {
  0%, 35% {
    opacity: 1;
  }
  70%, 100% {
    opacity: 0;
  }
}

@keyframes newPhotoFade {
  0%, 35% {
    opacity: 0;
  }
  70%, 100% {
    opacity: 1;
  }
}

@keyframes gentleZoom {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.08);
  }
}

@keyframes oldTextFade {
  0%, 35% {
    opacity: 1;
    filter: brightness(1);
  }
  55%, 100% {
    opacity: 0;
    filter: brightness(.5);
  }
}

@keyframes newTextFade {
  0%, 45% {
    opacity: 0;
    transform: scale(.95);
    filter: brightness(.7);
  }
  75%, 100% {
    opacity: 1;
    transform: scale(1);
    filter: brightness(1.25);
  }
}
.memory-center {
  position: absolute;
  left: 38%;
  top: 25%;
  width: 24%;
  height: 46%;
  z-index: 5;
  overflow: hidden;
  border: 8px solid #d4af37;
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(212,175,55,.7);
}


.memory-center img,
.orbit-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.memory-orbit {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 760px;
  height: 540px;
  transform: translate(-50%, -50%);
  z-index: 5;
}

.slide.active .memory-orbit {
  animation: orbitSpin 18s linear infinite;
}




.orbit-photo {
  position: absolute;
  width: 145px;
  height: 145px;
  overflow: hidden;
  border: 5px solid #d4af37;
  border-radius: 50%;
  box-shadow: 0 0 20px rgba(212,175,55,.45);
}

.orbit-photo:nth-child(1) {
  left: 50%;
  top: 0;
  transform: translateX(-50%);
}

.orbit-photo:nth-child(2) {
  right: 0;
  top: 50%;
  transform: translateY(-50%);
}

.orbit-photo:nth-child(3) {
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
}

.orbit-photo:nth-child(4) {
  left: 0;
  top: 50%;
  transform: translateY(-50%);
}

.memory-orbit-text {
  position: absolute;
  left: 5%;
  bottom: 8%;
  width: 90%;
  z-index: 6;
  font-family: 'Montserrat', sans-serif;
  letter-spacing: 2px;
  color: #F6DF8F;
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  white-space: pre-line;
  text-shadow:
     0 3px 6px rgba(0,0,0,.95),
    0 0 14px rgba(212,175,55,.35);
  opacity: 0;
}


.slide.active .memory-orbit {
  animation: orbitSpin 18s linear infinite;
}

.slide.active .orbit-photo img {
  animation: keepOrbitPhotoUpright 18s linear infinite;
  transform-origin: center center;
}

@keyframes keepOrbitPhotoUpright {
  from {
    transform: rotate(0deg) scale(1.12);
  }

  to {
    transform: rotate(-360deg) scale(1.12);
  }
}


.slide.active .memory-orbit-text {
  animation: textGlowIn 1.8s ease forwards;
}

@keyframes orbitSpin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }

  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}




.scatter-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.scatter-card {
  --s: 10px;
  --b: 3px;
  --c: #d4af37;

  position: absolute;
  width: 170px;
  height: 170px;
  padding: var(--s);
  box-sizing: border-box;
  z-index: 50;
  opacity: 0;
  transform: scale(.8) translateY(20px);

  --_g: #0000 25%, var(--c) 0;

  background:
    conic-gradient(from 90deg at top var(--b) left var(--b), var(--_g)) 0 0,
    conic-gradient(from 180deg at top var(--b) right var(--b), var(--_g)) 100% 0,
    conic-gradient(from 0deg at bottom var(--b) left var(--b), var(--_g)) 0 100%,
    conic-gradient(from -90deg at bottom var(--b) right var(--b), var(--_g)) 100% 100%;

  background-size: 15% 15%;
  background-repeat: no-repeat;
}

.scatter-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.slide.active .scatter-card {
  animation: scatterCardReveal 1.2s ease forwards;
}

.slide.active .scatter-card.p1 { animation-delay: 0s; }
.slide.active .scatter-card.p2 { animation-delay: .7s; }
.slide.active .scatter-card.p3 { animation-delay: 1.4s; }
.slide.active .scatter-card.p4 { animation-delay: 2.1s; }
.slide.active .scatter-card.p5 { animation-delay: 2.8s; }

@keyframes scatterCardReveal {
  0% {
    opacity: 0;
    transform: scale(.8) translateY(20px);
    background-size: 15% 15%;
    filter: brightness(.7) blur(2px);
  }

  70% {
    opacity: 1;
    transform: scale(1.06) translateY(0);
    filter: brightness(1.25) blur(0);
  }

  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
    background-size: 45% 45%;
    filter: brightness(1);
  }
}

.scatter-text {
  position: absolute;
  left: 28%;
  top: 40%;
  width: 44%;
  z-index: 60;
  font-family: 'Montserrat', sans-serif;
  letter-spacing: 1px;
  color: #F6DF8F;
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  line-height: 1.15;
  white-space: pre-line;
  text-shadow:
    0 2px 4px rgba(0,0,0,.9),
    0 0 10px rgba(212,175,55,.30);

  opacity: 0;
}

.slide.active .scatter-text {
  animation: textGlowIn 1.8s ease forwards;
  animation-delay: 3.4s;
}

.polaroid-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.polaroid-stack {
  position: absolute;
  left: 14%;
  top: 14%;
  width: 320px;
  height: 390px;
  z-index: 20;
}

.polaroid-card {
  position: absolute;
  width: 320px;
  height: 390px;
  background: #fffdf4;
  padding: 18px 18px 62px 18px;
  box-sizing: border-box;
  box-shadow:
    0 12px 30px rgba(0,0,0,.55),
    0 0 18px rgba(212,175,55,.22);
  opacity: 1;
  transform-origin: center center;
}

.polaroid-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* stacked look */
.polaroid-card.p1 { transform: rotate(-7deg) translate(-18px, 12px); z-index: 6; }
.polaroid-card.p2 { transform: rotate(5deg) translate(14px, 5px); z-index: 5; }
.polaroid-card.p3 { transform: rotate(-3deg) translate(-8px, -4px); z-index: 4; }
.polaroid-card.p4 { transform: rotate(8deg) translate(18px, -10px); z-index: 3; }
.polaroid-card.p5 { transform: rotate(-5deg) translate(-14px, -16px); z-index: 2; }
.polaroid-card.p6 { transform: rotate(2deg) translate(6px, -22px); z-index: 1; }

.slide.active .polaroid-card.p1 {
  animation: dropPolaroid1 1.1s ease-in forwards;
  animation-delay: 3s;
}

.slide.active .polaroid-card.p2 {
  animation: dropPolaroid2 1.1s ease-in forwards;
  animation-delay: 6s;
}

.slide.active .polaroid-card.p3 {
  animation: dropPolaroid3 1.1s ease-in forwards;
  animation-delay: 9s;
}

.slide.active .polaroid-card.p4 {
  animation: dropPolaroid4 1.1s ease-in forwards;
  animation-delay: 12s;
}

.slide.active .polaroid-card.p5 {
  animation: dropPolaroid5 1.1s ease-in forwards;
  animation-delay: 15s;
}

.polaroid-card.p6 {
  z-index: 1;
}

@keyframes dropPolaroid1 {
  to {
    transform: rotate(-22deg) translate(-520px, 440px);
    opacity: 0;
  }
}

@keyframes dropPolaroid2 {
  to {
    transform: rotate(24deg) translate(560px, 440px);
    opacity: 0;
  }
}

@keyframes dropPolaroid3 {
  to {
    transform: rotate(-25deg) translate(-500px, 460px);
    opacity: 0;
  }
}

@keyframes dropPolaroid4 {
  to {
    transform: rotate(26deg) translate(540px, 470px);
    opacity: 0;
  }
}

@keyframes dropPolaroid5 {
  to {
    transform: rotate(-20deg) translate(-480px, 480px);
    opacity: 0;
  }
}

.polaroid-text {
  position: absolute;
  left: 53%;
  top: 32%;
  width: 48%;

.polaroid-caption {

.gallery-bg {

}

.gallery-photo {

.gallery-photo img {

.gallery-photo.g1 { left: 8%; top: 15%; }

.slide.active .gallery-photo.g1 {

}

.slide.active .gallery-photo.g2 {
  animation: spotlightPhoto 3s ease forwards;

}

.slide.active .gallery-photo.g3 {
  animation: spotlightPhoto 3s ease forwards;

}

.slide.active .gallery-photo.g4 {
  animation: spotlightPhoto 3s ease forwards;

}

.slide.active .gallery-photo.g5 {

@keyframes spotlightPhoto {

  0% {
    filter: brightness(.35);
    transform: scale(1);
  }

  20% {
    filter: brightness(1.6);
    transform: scale(1.08);
    box-shadow:
      0 0 40px rgba(212,175,55,.9);

  80% {
    filter: brightness(1.6);
    transform: scale(1.08);
    box-shadow:
      0 0 40px rgba(212,175,55,.9);

.gallery-text {
  position: absolute;
  left: 28%;
  top: 43%;
  width: 44%;
  z-index: 30;
  color: #F6DF8F;
  font-size: 36px;
   font-family: 'Montserrat', sans-serif;
  font-weight: bold;

  white-space: pre-line;
   text-shadow:
    0 3px 6px rgba(0,0,0,.95),

}

.gallery-beam {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  z-index: 12;
  pointer-events: none;

  background: radial-gradient(
    circle,

  );

@keyframes galleryBeamMove {

/* Slide 8: Future Begins */
.future-photo {
  position: absolute;
  left: 11.67%;
  top: 10.09%;

  height: 78.43%;

  z-index: 1;

-------------------------- */

  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.support-main {
  position: absolute;
  left: 37%;
  top: 20%;

.support-small.s3 { left: 15%; top: 63%; }
.support-small.s4 { left: 70%; top: 63%; }

.slide.active .support-small.s1 {

.slide.active .support-small.s2 {

function fileToURL(inputId) {
  const input = document.getElementById(inputId);
  if (!input.files || !input.files[0]) return null;
  return URL.createObjectURL(input.files[0]);
}

function multiFileToURL(inputId, index) {
  const input = document.getElementById(inputId);
  if (!input || !input.files || !input.files[index]) return "";
  return URL.createObjectURL(input.files[index]);
}

function setPhotoOrientationClass(img, box) {
  img.onload = function () {
    box.classList.remove("portrait","landscape","square");

    const ratio = img.naturalWidth / img.naturalHeight;

    if (ratio > 1.15) {
      box.classList.add("landscape");
    } else if (ratio < 0.85) {
      box.classList.add("portrait");
    } else {
      box.classList.add("square");
    }
  };
}


function pct(v) {
  return v + "%";
}



function checkMultiImageIsPortrait(inputId, index) {
  return new Promise(resolve => {
    const input = document.getElementById(inputId);

    if (!input || !input.files || !input.files[index]) {
      resolve({ ok: true, empty: true });
      return;
    }

    const img = new Image();
    const url = URL.createObjectURL(input.files[index]);

    img.onload = function () {
      const isPortrait = img.naturalHeight > img.naturalWidth;
      URL.revokeObjectURL(url);

      resolve({
        ok: isPortrait,
        empty: false,
        width: img.naturalWidth,
        height: img.naturalHeight
      });
    };

    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve({ ok: false, empty: false, error: true });
    };

    img.src = url;
  });
}

async function validateSlide2PortraitPhotos() {
  const warning = document.getElementById("slide2PortraitWarning");
  if (!warning) return true;

  const result1 = await checkMultiImageIsPortrait("slide2Photos", 0);
  const result2 = await checkMultiImageIsPortrait("slide2Photos", 1);

  const problems = [];

  if (!result1.empty && !result1.ok) {
    problems.push("Photo 1 is not portrait.");
  }

  if (!result2.empty && !result2.ok) {
    problems.push("Photo 2 is not portrait.");
  }

  if (problems.length) {
    warning.innerHTML =
      "⚠️ Slide 2 works best with portrait photos because the frame openings are vertical.<br>" +
      problems.join("<br>");
    warning.classList.remove("hidden");
    return false;
  }

  warning.textContent = "";
  warning.classList.add("hidden");
  return true;
}


let uploadedMusicURL = null;
let recorder = null;
let recordedChunks = [];

function setExportStatus(message, show = true) {
  const status = document.getElementById("exportStatus");
  if (!status) return;
  status.innerHTML = message;
  status.classList.toggle("hidden", !show);
}

function getTotalShowDuration() {
  return Object.keys(layouts).reduce((total, key) => {
    return total + (layouts[key].duration || 6000);
  }, 0);
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function waitForImage(img) {
  return new Promise(resolve => {
    if (!img) {
      resolve();
      return;
    }

    if (img.complete && img.naturalWidth > 0) {
      resolve();
      return;
    }

    img.onload = () => resolve();
    img.onerror = () => resolve();
  });
}

async function waitForAllSlideImages() {
  const stage = document.getElementById("stage");
  const images = [...stage.querySelectorAll("img")];

  setExportStatus(`Loading ${images.length} image layers before export...`);

  await Promise.all(images.map(waitForImage));

  // Small extra breath so CSS layout/paint catches up before recording.
  await wait(400);
}

function setupMusicUpload() {
  const musicUpload = document.getElementById("musicUpload");
  const musicPlayer = document.getElementById("musicPlayer");

  if (!musicUpload || !musicPlayer) return;

  musicUpload.addEventListener("change", () => {
    const file = musicUpload.files && musicUpload.files[0];

    if (!file) {
      uploadedMusicURL = null;
      musicPlayer.removeAttribute("src");
      return;
    }

    uploadedMusicURL = URL.createObjectURL(file);
    musicPlayer.src = uploadedMusicURL;
    musicPlayer.load();

    setExportStatus("Music loaded. It will be included in preview/export if your browser allows audio capture.");
  });
}

function getSupportedRecorderMimeType() {
  const types = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  return types.find(type => MediaRecorder.isTypeSupported(type)) || "";

function buildThenNowSlide() {

function resetAnimations(slide) {
  slide.querySelectorAll(
    ".photo-box img, .text-box, .then-now-frame, .then-photo-old, .then-photo-new, .then-text-old, .then-text-new, .memory-orbit, .memory-orbit-text, .scatter-card, .scatter-text, .polaroid-card, .polaroid-text, .gallery-photo, .gallery-text, .gallery-beam, .future-photo img, .future-text, .future-sweep, .finale-hero img, .finale-memory, .finale-text, .finale-shine"
	
  ).forEach(el => {
    el.style.animation = "none";
    el.offsetHeight;
    el.style.animation = "";
  });
}
function showSlideByIndex(index) {
  const slides = document.querySelectorAll(".slide");

  slides.forEach(slide => {
    slide.classList.remove("active");
  });

  const slide = slides[index];
  if (!slide) return;

  resetAnimations(slide);
  slide.classList.add("active");
  currentSlideIndex = index;
}

function previewSelectedSlide() {
  clearTimeout(timer);	

  const selected = document.getElementById("slidePicker").value;
  const slides = document.querySelectorAll(".slide");

  slides.forEach(slide => {
    slide.classList.remove("active");
  });

  const target = document.querySelector(`.slide[data-key="${selected}"]`);

  if (!target) {
    console.log("Could not find slide:", selected);
    return;
  }

  resetAnimations(target);
  target.classList.add("active");
}
function togglePolaroidCaptions() {
  const enabled = document.getElementById("polaroidCaptionsOn").checked;
  document.getElementById("polaroidCaptionFields").classList.toggle("hidden", !enabled);
  buildPreview();
  previewSelectedSlide();
}

function playShow() {
  clearTimeout(timer);

  const slides = document.querySelectorAll(".slide");

  if (!slides.length) {
    buildPreview();
  }

  const keys = Object.keys(layouts);
  let index = 0;

  function playNextSlide() {
    if (index >= keys.length) {
      clearTimeout(timer);
      return;
    }

    const key = keys[index];
    const duration = layouts[key].duration || 6000;

    const slideIndex = [...document.querySelectorAll(".slide")]
      .findIndex(slide => slide.dataset.key === key);

    showSlideByIndex(slideIndex);

    index++;

    timer = setTimeout(playNextSlide, duration);
  }

  playNextSlide();
}
